<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Ofisnack V1.7.0 Base</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100">
<div class="max-w-6xl mx-auto p-6">
<h1 class="text-3xl font-bold text-slate-800 mb-6">Dashboard Ofisnack V1.7.0</h1>
<div class="grid md:grid-cols-2 gap-4 mb-6">
<div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">Total Snacks</div><div id="kpiSnacks" class="text-4xl font-bold"></div></div>
<div class="bg-white rounded-xl shadow p-5"><div class="text-gray-500">Total Boxes</div><div id="kpiBoxes" class="text-4xl font-bold"></div></div>
</div>
<div class="bg-white rounded-xl shadow p-4"><canvas id="ventas"></canvas></div>
</div>
<script>
fetch('datos.json').then(r=>r.json()).then(d=>{
 const ts=d.snacks.reduce((a,b)=>a+b,0), tb=d.boxes.reduce((a,b)=>a+b,0);
 document.getElementById('kpiSnacks').textContent=ts.toLocaleString('es-AR');
 document.getElementById('kpiBoxes').textContent=tb.toLocaleString('es-AR');
 new Chart(document.getElementById('ventas'),{
  type:'bar',
  data:{labels:d.meses,datasets:[
    {label:'Snacks',data:d.snacks},
    {label:'Boxes',data:d.boxes}
  ]},
  options:{responsive:true,plugins:{legend:{position:'bottom'}}}
 });
});
</script>
</body></html>
